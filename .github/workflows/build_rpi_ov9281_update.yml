name: build_rpi_ov9281_update

# Builds this branch for the RPi 4 (Bullseye armhf) and the RPi 5 (Bookworm
# arm64), with an OpenHD-SysUtils that knows the OV9281 (camera type 49), and
# packs an update.zip per board. On the SD card it goes to
# openhd/update/update.zip, the OpenHD updater installs it on the next boot.

on:
  push:
    branches:
      - "claude/upbeat-planck-c52i6b"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OpenHD-SysUtils main of 2026-11-24, the OV9281 profile is added to it
  SYSUTILS_REF: ebe03dd9af08612569d2c9ff20359db0bf2104d9

jobs:
  rpi4:
    name: RPi 4 (Bullseye armhf)
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          overprovision-lvm: 'true'

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Pick the OpenHD-SysUtils version
        run: |
          bash .github/scripts/sysutils_build_number.sh raspbian/bullseye armhf >> "$GITHUB_ENV"
          echo "SYSUTILS_REF=${SYSUTILS_REF}" >> "$GITHUB_ENV"

      - name: Build OpenHD and OpenHD-SysUtils
        uses: pguyot/arm-runner-action@45f370abd7eed1b20397277e5ec0cb0a31adb026
        with:
          base_image: raspios_lite:2023-05-03
          image_additional_mb: 4000
          copy_repository_path: /opt
          copy_artifact_path: out
          import_github_env: true
          shell: /bin/bash -euo pipefail
          commands: |
            cd /opt/OpenHD
            mkdir -p /usr/local/share/openhd/
            touch /usr/local/share/openhd/joyconfig.txt
            ./install_build_dep.sh rpi
            chown -R root:root /opt/OpenHD
            ./package.sh standard armhf raspbian bullseye
            mkdir -p /opt/out
            cp -v openhd_*_armhf.deb /opt/out/
            apt-get install -y --no-install-recommends device-tree-compiler dpkg-dev fakeroot
            bash .github/scripts/build_sysutils_ov9281.sh /opt/out

      - name: Pack update.zip
        run: bash .github/scripts/pack_update_zip.sh rpi4 out dist

      - uses: actions/upload-artifact@v7
        with:
          name: openhd-ov9281-rpi4
          path: dist/
          if-no-files-found: error

  rpi5:
    name: RPi 5 (Bookworm arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          overprovision-lvm: 'true'

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Pick the OpenHD-SysUtils version
        run: |
          bash .github/scripts/sysutils_build_number.sh raspbian/bookworm arm64 >> "$GITHUB_ENV"
          echo "SYSUTILS_REF=${SYSUTILS_REF}" >> "$GITHUB_ENV"

      - name: Build OpenHD and OpenHD-SysUtils
        uses: pguyot/arm-runner-action@45f370abd7eed1b20397277e5ec0cb0a31adb026
        with:
          base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2025-05-13/2025-05-13-raspios-bookworm-arm64-lite.img.xz
          cpu: cortex-a76
          image_additional_mb: 4000
          copy_repository_path: /opt
          copy_artifact_path: out
          import_github_env: true
          shell: /bin/bash -euo pipefail
          commands: |
            cd /opt/OpenHD
            apt-get update
            apt-get install -y --no-install-recommends \
              git ca-certificates cmake g++ make pkg-config python3 \
              libpoco-dev libusb-1.0-0-dev libpcap-dev libsodium-dev \
              libnl-3-dev libnl-genl-3-dev libnl-route-3-dev libsdl2-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libv4l-dev \
              device-tree-compiler dpkg-dev fakeroot
            cmake -S OpenHD -B /opt/build-openhd -DCMAKE_BUILD_TYPE=Release
            cmake --build /opt/build-openhd -j"$(nproc)"
            mkdir -p /opt/out/binaries
            cp -v /opt/build-openhd/openhd /opt/out/binaries/openhd
            bash .github/scripts/build_sysutils_ov9281.sh /opt/out

      - name: Pack update.zip
        run: bash .github/scripts/pack_update_zip.sh rpi5 out dist

      - uses: actions/upload-artifact@v7
        with:
          name: openhd-ov9281-rpi5
          path: dist/
          if-no-files-found: error
